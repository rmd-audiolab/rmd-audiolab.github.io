<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AudioLab">
<title>RMD AudioLab — Treino em casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="comum.css">
<style>
  main { max-width: 980px; margin: 0 auto; padding: 1rem; }
  .entrar { max-width: 440px; margin: 5vh auto; }
  .abas { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .abas button { flex: 1 1 140px; }
  .chat-msgs { height: 55vh; overflow: auto; background: rgba(0,0,0,.2); border-radius: 8px; padding: .5rem; }
  .chat-msg { max-width: 85%; margin: .35rem 0; padding: .4rem .6rem; border-radius: 10px; background: rgba(127,127,127,.18); }
  .chat-msg.meu { margin-left: auto; background: rgba(80,160,255,.25); }
  .chat-msg.prof { background: rgba(242,201,76,.2); }
  .chat-quem { font-size: .8rem; opacity: .8; }
  .chat-texto { white-space: pre-wrap; word-break: break-word; }
  .codigo { text-transform: uppercase; letter-spacing: .15em; font-size: 1.4rem; text-align: center; }
</style>
</head>
<body>
<header class="cabeca" id="cabeca"></header>
<main id="app"></main>
<script src="comum.js"></script>
<script src="motor.js"></script>
<script src="figuras.js"></script>
<script src="metronomo.js"></script>
<script src="bateria.js"></script>
<script src="musicos.js"></script>
<script src="vocal.js"></script>
<script src="treinos.js"></script>
<script src="ferramentas.js"></script>
<script src="documentos.js"></script>
<script src="casa.js"></script>
</body>
</html>
